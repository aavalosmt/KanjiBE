services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./data/kanji.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - kanji-data:/app/data

volumes:
  kanji-data:
